<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>مركز التواصل</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box" role="dialog" aria-labelledby="loginTitle">
            <div class="logo" aria-hidden="true">💬</div>
            <h1 id="loginTitle">مركز التواصل</h1>
            <p>سجّل دخولك للبدء بالمحادثة</p>

            <div class="field">
                <label for="email">البريد الإلكتروني</label>
                <input id="email" type="email" placeholder="example@email.com"
                       autocomplete="email" inputmode="email">
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>
                <input id="password" type="password" placeholder="أدخل كلمة المرور"
                       autocomplete="current-password">
            </div>

            <button id="loginButton" type="button" class="primary-button">تسجيل الدخول</button>
            <button id="forgotPasswordButton" type="button" class="forgot-password">
                نسيت كلمة المرور؟
            </button>
            <div id="loginError" class="error" role="alert" aria-live="polite"></div>
        </div>
    </div>

    <div id="app" class="app hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="brand-icon" aria-hidden="true">💬</span>
                <div class="brand-copy">
                    <strong>مركز التواصل</strong>
                    <small>مساحتك للتواصل</small>
                </div>
            </div>

            <div class="sidebar-content">
                <button id="groupButton" class="conversation-button active" type="button">
                    <span class="conversation-icon" aria-hidden="true">👥</span>
                    <span class="conversation-copy">
                        <strong>المجموعة العامة</strong>
                        <small>المحادثة الجماعية</small>
                    </span>
                    <span class="active-dot" aria-hidden="true"></span>
                </button>

                <div class="conversation-section-title">المحادثات الخاصة</div>
                <div id="customersList" class="customers-list"></div>
            </div>

            <button id="logoutButton" class="logout" type="button">
                <span aria-hidden="true">↪</span>
                <span>تسجيل الخروج</span>
            </button>
        </aside>

        <main class="chat">
            <section class="language-banner" aria-label="تعلم اللغة الإسبانية">
                <div class="language-banner-flag" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
                <div class="language-banner-content">
                    <strong>¡Aprende español!</strong>
                    <span>تعلّم اللغة الإسبانية خطوة بخطوة</span>
                </div>
                <div class="language-banner-decoration" aria-hidden="true">🇪🇸</div>
            </section>

            <header class="chat-header">
                <div class="chat-avatar" aria-hidden="true">👥</div>
                <div class="chat-heading">
                    <h2 id="conversationTitle">المجموعة العامة</h2>
                    <p id="conversationSubtitle">المحادثة الجماعية</p>
                </div>
                <div class="chat-header-status">
                    <span class="status-dot"></span>
                    متصل
                </div>
            </header>

            <section id="messages" class="messages" aria-live="polite">
                <div class="empty-messages">
                    <div class="empty-icon" aria-hidden="true">👋</div>
                    <strong>مرحبًا بك في مركز التواصل</strong>
                    <small>ابدأ بإرسال رسالة الآن</small>
                </div>
            </section>

            <div id="filePreview" class="file-preview hidden"></div>
<div id="replyPreview" class="reply-preview hidden">
    <div class="reply-preview-content">
        <span class="reply-preview-icon">↩</span>

        <div class="reply-preview-text">
            <strong id="replyPreviewSender">الرد على</strong>
            <span id="replyPreviewContent"></span>
        </div>
    </div>

    <button id="cancelReplyButton"
            type="button"
            class="cancel-reply"
            aria-label="إلغاء الرد">
        ×
    </button>
</div>
            <form id="messageForm" class="composer">
                <label id="imageButton" class="action-button" title="إرسال صورة" aria-label="إرسال صورة">
                    📷
                    <input id="imageInput" type="file" accept="image/*" hidden>
                </label>

                <button id="recordButton" type="button" class="action-button"
                        title="تسجيل صوتي" aria-label="تسجيل صوتي">🎤</button>

                <input id="messageInput" type="text" placeholder="اكتب رسالتك هنا..."
                       autocomplete="off" maxlength="5000" aria-label="نص الرسالة">

                <button type="submit" class="send-button" aria-label="إرسال الرسالة">➤</button>
            </form>
        </main>
    </div>

    <script src="app.js?v=12"></script>
</body>
</html>
